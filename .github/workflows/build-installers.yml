name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    # 32-битное приложение работает и на 32-бит, и на 64-бит Windows (через WOW64).
    # Поэтому собираем одну версию вместо двух отдельных установщиков.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-universal

      - name: Install npm dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run tauri:build -- --target i686-pc-windows-msvc

      - name: Prepare universal Windows installers
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/i686-pc-windows-msvc/release/bundle"
          $nsis = Get-ChildItem -Path "$bundle/nsis" -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem -Path "$bundle/msi" -Filter *.msi | Select-Object -First 1
          Copy-Item $nsis.FullName "Markup.Calculator_1.0.6_windows-setup.exe"
          Copy-Item $msi.FullName "Markup.Calculator_1.0.6_windows.msi"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-universal
          path: |
            Markup.Calculator_1.0.6_windows-setup.exe
            Markup.Calculator_1.0.6_windows.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Install npm dependencies
        run: npm install

      - name: Build universal macOS app
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Prepare macOS installers
        run: |
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "Markup.Calculator_1.0.6_macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Markup Calculator.app" \
            "Markup.Calculator_1.0.6_macos.app.zip"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Markup.Calculator_1.0.6_macos.dmg
            Markup.Calculator_1.0.6_macos.app.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.zip
