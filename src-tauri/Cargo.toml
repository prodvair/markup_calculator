[package]
name = "runar-calculator"
version = "1.0.0"
description = "Калькулятор округления, доставки и наценки"
authors = ["Runar"]
edition = "2021"

[lib]
name = "runar_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
